name: Validate encrypted dashboard

on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate public deployment payload
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('parts/manifest.json','utf8'));
          let joined = '';
          for (let i = 0; i < manifest.data; i++) joined += fs.readFileSync(`parts/data/${String(i).padStart(2,'0')}.txt`, 'utf8');
          const e = JSON.parse(joined);
          const p = JSON.parse(fs.readFileSync('config/public-key.json','utf8'));
          if (e.version !== 2 || !e.ciphertext || !e.ephemeral_public_jwk || !p.public_jwk || e.recipient?.kid !== p.kid) process.exit(1);
          console.log(`public encrypted deployment healthy: ${manifest.data} parts`);
          NODE
