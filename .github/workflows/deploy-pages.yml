name: Deploy Credit Control Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Basic encrypted-payload validation
        run: |
          node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync('data/dashboard.enc.json','utf8'));if(e.version!==2||!e.ciphertext||!e.ephemeral_public_jwk)process.exit(1);console.log('encrypted payload OK')"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
