name: Deploy Credit Control Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deidentified dashboard data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const idx = JSON.parse(fs.readFileSync('data/index.json','utf8'));
          if (idx.schema !== 'credit-control-room-public-v1' || !Array.isArray(idx.chunks) || !idx.chunks.length) process.exit(1);
          const forbidden = ['信件ID','附件檔名','資料來源'];
          let total = 0;
          for (const c of idx.chunks) {
            const p = `data/chunks/${c}.b64`;
            if (!fs.existsSync(p)) throw new Error(`missing ${p}`);
            const rows = JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync(p,'utf8').trim(),'base64')).toString('utf8'));
            if (!Array.isArray(rows)) throw new Error(`${c} is not an array`);
            for (const r of rows) for (const k of forbidden) if (Object.prototype.hasOwnProperty.call(r,k)) throw new Error(`forbidden public field ${k}`);
            total += rows.length;
          }
          const expected = Object.values(idx.counts || {}).reduce((a,b)=>a+Number(b||0),0);
          if (total !== expected) throw new Error(`row count mismatch: ${total} !== ${expected}`);
          console.log(`deidentified public data OK: ${total} rows / ${idx.chunks.length} chunks`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
