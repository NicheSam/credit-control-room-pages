name: Deploy Credit Control Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate chunked encrypted payload
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('parts/manifest.json','utf8'));
          let joined = '';
          for (let i = 0; i < manifest.data; i++) {
            joined += fs.readFileSync(`parts/data/${String(i).padStart(2,'0')}.txt`, 'utf8');
          }
          const e = JSON.parse(joined);
          if (e.version !== 2 || !e.ciphertext || !e.ephemeral_public_jwk || e.recipient?.kid !== 'ccr-p256-2026-08') process.exit(1);
          console.log(`encrypted payload OK: ${manifest.data} parts`);
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
