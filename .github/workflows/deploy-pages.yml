name: Deploy Credit Control Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate encrypted payload when present
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('parts/manifest.json','utf8'));
          let text = null;
          if (manifest.mode === 'parts') {
            let joined = '';
            for (let i = 0; i < Number(manifest.data || 0); i++) joined += fs.readFileSync(`parts/data/${String(i).padStart(2,'0')}.txt`, 'utf8');
            text = joined;
          } else if (fs.existsSync('data/dashboard.enc.json')) {
            text = fs.readFileSync('data/dashboard.enc.json','utf8');
          }
          if (!text) {
            console.log('Initial encrypted base snapshot not uploaded yet; deploying shell only.');
            process.exit(0);
          }
          const e = JSON.parse(text);
          if (e.version !== 2 || !e.ciphertext || !e.ephemeral_public_jwk || e.recipient?.kid !== 'ccr-p256-2026-08') process.exit(1);
          console.log(`encrypted payload OK (${manifest.mode || 'base'})`);
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
